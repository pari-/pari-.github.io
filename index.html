<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="pari — software, systems, and other useful things."
    />
    <title>pari</title>
    <style>
      :root {
        color-scheme: dark;

        --ink: #e8edf2;
        --muted: #84909c;
        --line: rgb(151 170 188 / 13%);
        --accent: #80d8c8;
        --bg: #0c1117;
        --panel: #151d26;
      }

      :root[data-theme="light"] {
        color-scheme: light;

        --ink: #17202a;
        --muted: #66737f;
        --line: rgb(23 32 42 / 16%);
        --accent: #087f70;
        --bg: #f4f7f9;
        --panel: #fff;
      }

      @media (prefers-color-scheme: light) {
        :root:not([data-theme]) {
          color-scheme: light;

          --ink: #17202a;
          --muted: #66737f;
          --line: rgb(23 32 42 / 16%);
          --accent: #087f70;
          --bg: #f4f7f9;
          --panel: #fff;
        }
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
          "Liberation Mono", monospace;
      }

      main {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }

      .center {
        width: 80vw;
        text-align: center;
      }

      .avatar-frame {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 13rem;
        height: 13rem;
        margin: 0 auto 1.25rem;
        border: 2px solid var(--line);
        border-radius: 50%;
        background: #fff;
        overflow: hidden;
      }

      .avatar {
        display: block;
        width: 10rem;
        height: 10rem;
        object-fit: cover;
      }

      h1 {
        margin: 0 0 .5rem;
        font-size: clamp(1.6rem, 4.5vw, 2.6rem);
        font-weight: 500;
        letter-spacing: -.08em;
      }

      .tagline {
        margin: 0 0 clamp(2rem, 4vw, 3rem);
        color: var(--muted);
        font-size: clamp(.75rem, 1vw, .9rem);
        letter-spacing: .08em;
        text-transform: uppercase;
      }

      .logos {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: clamp(1.25rem, 5vw, 3rem);
        margin: 0;
      }

      .logo-link {
        position: relative;
        display: block;
        color: inherit;
        text-decoration: none;
      }

      .logo-link img,
      .logo-link .logo {
        display: block;
        width: clamp(3.9rem, 12.6vw, 7.2rem);
        height: clamp(3.9rem, 12.6vw, 7.2rem);
        object-fit: contain;
        opacity: .9;
        transition: opacity .2s ease, transform .2s ease;
      }

      .logo-link:hover img,
      .logo-link:hover .logo,
      .logo-link:focus-visible img,
      .logo-link:focus-visible .logo {
        opacity: 1;
        transform: translateY(-.25rem);
      }

      .logo-story {
        position: absolute;
        bottom: calc(100% + .75rem);
        left: 50%;
        z-index: 1;
        width: clamp(14rem, 24vw, 18rem);
        padding: .75rem .9rem;
        border: 1px solid var(--line);
        border-radius: .35rem;
        background: var(--panel);
        color: var(--ink);
        font-size: clamp(.68rem, .9vw, .8rem);
        line-height: 1.45;
        opacity: 0;
        pointer-events: none;
        transform: translate(-50%, .25rem);
        transition: opacity .2s ease, transform .2s ease;
      }

      .logo-link:hover .logo-story,
      .logo-link:focus-visible .logo-story {
        opacity: 1;
        transform: translate(-50%, 0);
      }

      .links {
        display: flex;
        justify-content: center;
        gap: clamp(1.75rem, 4vw, 3rem);
        margin-top: clamp(2.5rem, 4vw, 3.5rem);
      }

      .links a,
      .links .email {
        display: inline-flex;
        align-items: center;
        gap: .5rem;
        color: var(--muted);
        font-size: clamp(.75rem, .9vw, .85rem);
        text-decoration: none;
        transition: color .2s ease;
      }

      .links a:hover,
      .links a:focus-visible {
        color: var(--accent);
      }

      .links svg {
        width: clamp(1.2rem, 2vw, 1.5rem);
        height: clamp(1.2rem, 2vw, 1.5rem);
        fill: currentcolor;
      }

      .github-ribbon {
        --ribbon-width: clamp(28rem, 80vw, 42rem);

        position: fixed;
        top: 1.5rem;
        right: -15rem;
        z-index: 2;
        display: flex;
        justify-content: center;
        align-items: center;
        width: var(--ribbon-width);
        padding: .85rem 0;
        background: #24292f;
        color: #fff;
        font-size: clamp(.9rem, 1.2vw, 1.05rem);
        font-weight: 400;
        letter-spacing: 0;
        line-height: 1.2;
        white-space: nowrap;
        text-align: center;
        text-shadow: 0 1px 2px rgb(0 0 0 / 35%);
        text-decoration: none;
        transform: rotate(45deg);
        box-shadow: 0 2px 8px rgb(0 0 0 / 25%);
      }

      .github-ribbon span {
        transform: translateX(2rem);
      }

      .github-ribbon:hover,
      .github-ribbon:focus-visible {
        background: #0969da;
      }

      .theme-toggle {
        position: fixed;
        right: 1.5rem;
        bottom: 1.5rem;
        z-index: 3;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: .65rem 1rem;
        background: var(--panel);
        color: var(--muted);
        font: inherit;
        font-size: clamp(.75rem, 1vw, .9rem);
        line-height: 1;
        box-shadow: 0 4px 16px rgb(0 0 0 / 12%);
        cursor: pointer;
        transition: color .2s ease, border-color .2s ease, transform .2s ease;
      }

      .theme-toggle:hover,
      .theme-toggle:focus-visible {
        color: var(--accent);
        border-color: var(--accent);
        transform: translateY(-.15rem);
        opacity: 1;
      }

      @media (width <= 520px) {
        .logos {
          gap: 1rem;
        }

        .links {
          margin-top: 2.25rem;
        }

        .github-ribbon {
          top: 1rem;
          right: -10rem;
        }

        .theme-toggle {
          right: 1rem;
          bottom: 1rem;
        }
      }
    </style>
  </head>

  <body>
    <a
      class="github-ribbon"
      href="https://github.com/pari-/pari-.github.io"
      target="_blank"
      rel="noopener noreferrer"
      ><span>Fork me on GitHub</span></a
    >
    <button
      class="theme-toggle"
      type="button"
      aria-label="Switch to light mode"
      aria-pressed="false"
    ></button>
    <main>
      <section class="center" aria-labelledby="title">
        <a
          class="avatar-frame"
          href="https://github.com/pari-"
          rel="me"
          aria-label="pari- on GitHub"
        >
          <img
            class="avatar"
            src="https://github.com/pari-.png?size=256"
            alt="pari-"
          />
        </a>
        <h1 id="title">pari (Patrick Ringl)</h1>
        <p class="tagline">build · automate · discover</p>

        <div class="logos">
          <a
            class="logo-link"
            href="https://www.debian.org/"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Debian"
          >
            <img src="https://cdn.simpleicons.org/debian/A81D33" alt="Debian" />
          </a>
          <a
            class="logo-link"
            href="https://www.python.org/"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Python"
          >
            <img
              src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/python/python-original.svg"
              alt="Python"
            />
          </a>
          <a
            class="logo-link"
            href="https://kubernetes.io/"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Kubernetes"
          >
            <img
              src="https://cdn.simpleicons.org/kubernetes/326CE5"
              alt="Kubernetes"
            />
          </a>
          <a
            class="logo-link"
            href="https://www.factorio.com/"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Factorio"
          >
            <svg
              class="logo"
              viewBox="0 0 64 64"
              role="img"
              aria-label="Factorio"
            >
              <path
                fill="#f5a623"
                d="m28 3 8 0 2 7a23 23 0 0 1 6 3l6-4 6 6-4 6a23 23 0 0 1 3 6l7 2v8l-7 2a23 23 0 0 1-3 6l4 6-6 6-6-4a23 23 0 0 1-6 3l-2 7h-8l-2-7a23 23 0 0 1-6-3l-6 4-6-6 4-6a23 23 0 0 1-3-6l-7-2v-8l7-2a23 23 0 0 1 3-6l-4-6 6-6 6 4a23 23 0 0 1 6-3l2-7Zm4 14a15 15 0 1 0 0 30 15 15 0 0 0 0-30Zm-7 7h17v6H32v4h8v6h-8v7h-7V24Z"
              />
            </svg>
          </a>
        </div>

        <nav class="links" aria-label="Contact links">
          <span class="email">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M2.5 5.5h19v13h-19v-13Zm1.8 1.7v.6l7.7 5.2 7.7-5.2v-.6H4.3Zm15.4 9.6V10l-7.2 4.8a.9.9 0 0 1-1 0L4.3 10v6.8h15.4Z"
              />
            </svg>
            p [at] trick [dot] rin [dot] gl
          </span>
          <a href="https://github.com/pari-" rel="me" aria-label="GitHub">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M12 2.2a9.8 9.8 0 0 0-3.1 19.1c.5.1.7-.2.7-.5v-1.8c-2.8.6-3.4-1.2-3.4-1.2-.5-1.1-1.1-1.4-1.1-1.4-.9-.6.1-.6.1-.6 1 0 1.5 1 1.5 1 .9 1.5 2.3 1.1 2.9.8.1-.6.4-1.1.6-1.3-2.2-.3-4.5-1.1-4.5-4.9 0-1.1.4-2 1-2.7-.1-.3-.4-1.3.1-2.7 0 0 .8-.3 2.7 1a9.4 9.4 0 0 1 5 0c1.9-1.3 2.7-1 2.7-1 .5 1.4.2 2.4.1 2.7.6.7 1 1.6 1 2.7 0 3.8-2.3 4.6-4.5 4.9.4.3.7.9.7 1.8v2.7c0 .3.2.6.7.5A9.8 9.8 0 0 0 12 2.2Z"
              />
            </svg>
            github
          </a>
        </nav>
      </section>
    </main>
    <script>
      const root = document.documentElement;
      const toggle = document.querySelector(".theme-toggle");
      const system = matchMedia("(prefers-color-scheme: dark)");
      const saved = localStorage.getItem("theme");

      if (saved === "light" || saved === "dark") root.dataset.theme = saved;

      function updateThemeToggle() {
        const dark =
          (root.dataset.theme || (system.matches ? "dark" : "light")) ===
          "dark";
        toggle.textContent = dark ? "☼ light" : "☾ dark";
        toggle.setAttribute(
          "aria-label",
          `Switch to ${dark ? "light" : "dark"} mode`,
        );
        toggle.setAttribute("aria-pressed", dark);
      }

      toggle.addEventListener("click", () => {
        root.dataset.theme =
          (root.dataset.theme || (system.matches ? "dark" : "light")) === "dark"
            ? "light"
            : "dark";
        localStorage.setItem("theme", root.dataset.theme);
        updateThemeToggle();
      });

      system.addEventListener("change", updateThemeToggle);
      updateThemeToggle();
    </script>
  </body>
</html>
